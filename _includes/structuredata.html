{% if page.layout == "post" or page.layout == "project" %}
<!-- Article Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "@id": "{{ page.url | absolute_url }}#article",
  "isPartOf": {
    "@type": "WebSite",
    "@id": "{{ site.url }}#website",
    "name": "ZeoSpec",
    "url": "{{ site.url }}"
  },
  "headline": {{ page.title | jsonify }},
  "image": [
    "{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ site.data.general_settings.social_media_share_image | absolute_url }}{% endif %}"
  ],
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{% if page.last_modified_at %}{{ page.last_modified_at | date_to_xmlschema }}{% else %}{{ page.date | date_to_xmlschema }}{% endif %}",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  },
  "author": {
    "@type": "Person",
    "@id": "{{ site.url }}#person",
    "name": "Arun Teja Godavarthi",
    "alternateName": "ZeoSpec",
    "url": "{{ site.url }}/",
    "sameAs": [
      "https://www.linkedin.com/in/zeospec/",
      "https://x.com/ZeoSpec",
      "https://github.com/ZeoSpec",
      "https://rtr.zeospec.com/"
    ]
  },
  "publisher": {
    "@type": "Person",
    "@id": "{{ site.url }}#person",
    "name": "Arun Teja Godavarthi",
    "url": "{{ site.url }}/",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.url }}/images/logo.svg"
    }
  },
  "description": {% if page.description %}{{ page.description | strip_html | strip_newlines | jsonify }}{% else %}{{ site.data.general_settings.description | jsonify }}{% endif %},
  "keywords": {% if page.tags %}{{ page.tags | join: ', ' | jsonify }}{% else %}"Arun Teja Godavarthi, ZeoSpec, Ecosystem Builder, Developer Ecosystems"{% endif %},
  "articleSection": {% if page.tags %}{{ page.tags | first | capitalize | jsonify }}{% else %}"Technology"{% endif %},
  "inLanguage": "en-US",
  "wordCount": {{ content | number_of_words }},
  "timeRequired": "PT{{ content | number_of_words | divided_by: 180 | plus: 1 }}M"
}
</script>

<!-- Breadcrumb Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Blog",
      "item": "{{ site.url }}/blog/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }
  ]
}
</script>

{% else %}

<!-- Person Schema (Entity Knowledge Graph) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "{{ site.url }}#person",
  "name": "Arun Teja Godavarthi",
  "alternateName": ["ZeoSpec", "aruntejagod"],
  "jobTitle": "Ecosystem Builder & Entrepreneur",
  "description": {{ site.data.general_settings.description | jsonify }},
  "url": "{{ site.url }}",
  "image": "{{ site.url }}/images/zeospec-4.jpg",
  "sameAs": [
    "https://www.linkedin.com/in/zeospec/",
    "https://x.com/ZeoSpec",
    "https://twitter.com/ZeoSpec",
    "https://github.com/ZeoSpec",
    "https://facebook.com/zeospec/",
    "https://instagram.com/ZeoSpec/",
    "https://rtr.zeospec.com/"
  ],
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Bangalore",
    "addressRegion": "Karnataka",
    "addressCountry": "India"
  },
  "email": "hi@zeospec.com",
  "alumniOf": {
    "@type": "Organization",
    "name": "CMR Institute of Technology",
    "url": "https://www.cmrit.ac.in/"
  },
  "birthPlace": {
    "@type": "Place",
    "name": "Siruguppa"
  },
  "memberOf": {
    "@type": "Organization",
    "name": "Rotaract Bangalore East",
    "url": "https://rtr.zeospec.com/"
  },
  "nationality": "Indian",
  "knowsAbout": [
    "Developer Ecosystems",
    "Strategic Partnerships",
    "Developer Programs",
    "Engineering Program Management",
    "Go-to-Market (GTM) Strategy",
    "Open Source Strategy",
    "Community Growth & Strategy",
    "Entrepreneurship",
    "Rotaract"
  ],
  "knowsLanguage": ["English", "Hindi", "Telugu", "Kannada"]
}
</script>

<!-- Website Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "{{ site.url }}#website",
  "name": "ZeoSpec",
  "alternateName": "Arun Teja Godavarthi (ZeoSpec)",
  "url": "{{ site.url }}",
  "description": {{ site.data.general_settings.description | jsonify }},
  "publisher": {
    "@id": "{{ site.url }}#person"
  },
  "author": {
    "@id": "{{ site.url }}#person"
  },
  "inLanguage": "en-US"
}
</script>

{% if page.url != "/" and page.url != "/index.html" %}
<!-- Breadcrumb Schema for Standalone Pages -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": {% if page.title %}{{ page.title | jsonify }}{% else %}"{{ page.url }}"{% endif %},
      "item": "{{ page.url | absolute_url }}"
    }
  ]
}
</script>
{% endif %}

{% endif %}
